{% extends "layout.html" %}

{% block container %}

<form action="/distancia" method="post">
    <div class="form-group pt-4">
        <label for="px1" class="form-label">Primer punto (coordenada x):</label>
        <input type="number" step="any" name="px1" class="form-control" id="px1" value="{{ px1 }}" placeholder="Ingresa la coordenada X" required>
    </div>

    <div class="form-group pt-4">
        <label for="py1" class="form-label">Primer punto (coordenada y):</label>
        <input type="number" step="any" name="py1" class="form-control" id="py1" value="{{ py1 }}" placeholder="Ingresa la coordenada Y" required>
    </div>

    <div class="form-group pt-4">
        <label for="px2" class="form-label">Segundo punto (coordenada x):</label>
        <input type="number" step="any" name="px2" class="form-control" id="px2" value="{{ px2 }}" placeholder="Ingresa la coordenada X" required>
    </div>

    <div class="form-group pt-4">
        <label for="py2" class="form-label">Segundo punto (coordenada y):</label>
        <input type="number" step="any" name="py2" class="form-control" id="py2" value="{{ py2 }}" placeholder="Ingresa la coordenada Y" required>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Calcular distancia</button>
</form>

<div class="mt-3">
    <h1>Distancia: {{ "%.2f"|format(distancia) }}</h1>
</div>

{% endblock %}
